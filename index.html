<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angels of Death - Calculadora de Fabricação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Angels of Death</h1>

    <!-- Tabela de Receitas -->
    <div class="table-card">
      <h2>Fabricação</h2>
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Qtd. Desejada</th>
            <th>Materiais Necessários</th>
          </tr>
        </thead>
        <tbody id="tabela-fabricacao"></tbody>
      </table>
    </div>

    <!-- Tabela de Totais -->
    <div class="table-card">
      <h2>Total de Materiais Necessários</h2>
      <table>
        <thead>
          <tr>
            <th>Material</th>
            <th>Quantidade Total</th>
          </tr>
        </thead>
        <tbody id="tabela-totais">
          <tr>
            <td colspan="2" class="empty-msg">Nenhum item selecionado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="fabricacao.js"></script>
</body>
</html>
